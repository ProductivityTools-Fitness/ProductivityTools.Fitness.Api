name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    strategy:
      fail-fast: false # Pozwala jednemu runnerowi dokończyć wdrożenie nawet jeśli drugi napotka błąd
      matrix:
        target-runner:
          - "fitness-vm"
          - "T460Ubuntu1"

    runs-on: [ self-hosted, "${{ matrix.target-runner }}" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Identify user running the workflow
    - name: Identify User
      run: |
        echo "Running on runner: ${{ matrix.target-runner }}"
        whoami
        id

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew --stop
        ./gradlew clean build --rerun-tasks

    - name: Stop application
      run: |
        echo "Stopping application"
        sudo systemctl stop fitness-api || true

    - name: Copy Jar to /opt/PT.Fitness-Api
      run: |
        echo "Copying JAR to /opt/PT.Fitness-Api"
        umask 002
        JAR=build/libs/fitness-api-0.0.1-SNAPSHOT.jar
        if [ ! -f "$JAR" ]; then
          echo "Jar not found at $JAR"; exit 1
        fi
        sudo mkdir -p /opt/PT.Fitness-Api
        sudo cp "$JAR" /opt/PT.Fitness-Api/

    - name: Configure environment variables and systemd service
      env:
        DB_PASS: ${{ secrets.DB_PASSWORD }}
      run: |
        echo "Configuring environment variables and systemd service file..."
        
        # 1. Create secure environment file with DB password
        if [ -n "$DB_PASS" ]; then
          echo "DB_PASSWORD=$DB_PASS" > /tmp/fitness-api.env
          sudo mv /tmp/fitness-api.env /opt/PT.Fitness-Api/fitness-api.env
          sudo chmod 600 /opt/PT.Fitness-Api/fitness-api.env
        fi

        # 2. Configure and install systemd service
        CURRENT_USER=$(whoami)
        cp deployment/fitness-api.service /tmp/fitness-api.service
        sed -i "s/USER_PLACEHOLDER/$CURRENT_USER/g" /tmp/fitness-api.service
        sudo mv /tmp/fitness-api.service /etc/systemd/system/fitness-api.service
        sudo systemctl daemon-reload

    - name: Start application
      run: |
        echo "Starting application"
        sudo systemctl start fitness-api
